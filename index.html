<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chain Crew has moved</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1316; color: #eef2ee; font-family: Barlow, 'Segoe UI', Roboto, system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  a.btn { display: inline-block; margin-top: 18px; padding: 16px 28px; border-radius: 12px; background: #f2c744; color: #17130a; font-weight: 700; font-size: 20px; text-decoration: none; }
  p { color: #94a19b; max-width: 32em; }
</style>
</head>
<body>
<div>
  <h1>Chain Crew has moved</h1>
  <p>The app now lives at a new address. Open it there, then install it from Chrome's menu (<b>Install and create shortcut</b> → <b>Install</b>). Your games are already waiting at the new address.</p>
  <a class="btn" href="https://jrob15.github.io/chain-crew/">Open Chain Crew</a>
  <p style="margin-top:28px;font-size:14px">You can remove any old Chain Crew icon from your home screen.</p>
</div>
<script>
  // retire the old offline copy so this notice shows instead of the cached app
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
</script>
</body>
</html>
