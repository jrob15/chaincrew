<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chain Crew">
<title>Chain Crew</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
/* Layout: a one-screen press-box console — scoreboard on top, field strip and down & distance,
   a grid of big play buttons, the last play with Undo, and tabs along the bottom. Dark-first for night games. */
:root {
  --bg: #0e1316;
  --surface: #161d22;
  --surface-2: #202a31;
  --fg: #eef2ee;
  --muted: #94a19b;
  --line: #2c3840;
  --accent: #f2c744;
  --accent-fg: #17130a;
  --good: #4fc98c;
  --bad: #ef5a5a;
  --info: #62acff;
  --turf: #1d5c33;
  --turf-dark: #184d2b;
  --chalk: rgba(255,255,255,.62);
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --font-display: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', 'Segoe UI', Roboto, system-ui, sans-serif;
  --radius: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1ec; --surface: #ffffff; --surface-2: #e4e9e3; --fg: #141b1f; --muted: #5a6964; --line: #cfd7d1;
    --accent: #b88a00; --accent-fg: #ffffff; --good: #1f8f55; --bad: #c62828; --info: #1e6fd9;
    --turf: #2f8d4f; --turf-dark: #297a45; --chalk: rgba(255,255,255,.8); --shadow: 0 10px 30px rgba(20,30,25,.18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1ec; --surface: #ffffff; --surface-2: #e4e9e3; --fg: #141b1f; --muted: #5a6964; --line: #cfd7d1;
  --accent: #b88a00; --accent-fg: #ffffff; --good: #1f8f55; --bad: #c62828; --info: #1e6fd9;
  --turf: #2f8d4f; --turf-dark: #297a45; --chalk: rgba(255,255,255,.8); --shadow: 0 10px 30px rgba(20,30,25,.18);
  color-scheme: light;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.35;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
#app { display: flex; flex-direction: column; height: 100%; }
main#view { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg); }
h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }
.grow { flex: 1 1 auto; }
.hide { display: none !important; }

/* scoreboard */
#scoreboard { flex: 0 0 auto; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.sb-team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sb-team.away { justify-content: flex-end; }
.sb-team .abbr { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-team .score { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.sb-team .ball { width: 14px; height: 9px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; transform: rotate(-30deg); box-shadow: 0 0 0 2px var(--surface); }
.sb-team .ball.off { visibility: hidden; }
.swatch { width: 10px; height: 26px; border-radius: 3px; flex: 0 0 auto; }
.sb-mid { text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.15; }
.sb-mid b { color: var(--fg); font-size: 18px; display: block; }
.tos { display: inline-flex; gap: 3px; vertical-align: middle; }
.tos i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .35; }
.tos i.on { opacity: 1; background: var(--fg); }

/* situation */
.situation { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.situation .dd { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .01em; }
.situation .dd small { display: block; font-size: 22px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-top: 2px; }
.situation .drive { color: var(--muted); font-size: 14px; }
.linkbtn { background: none; border: 0; color: var(--info); padding: 6px 4px; font-weight: 600; }
.linkbtn.danger { color: var(--bad); }

/* field */
.field { width: 100%; max-width: 100%; display: block; border-radius: 6px; touch-action: none; user-select: none; }
.field-wrap { position: relative; }
.field-cap { display: flex; flex: 1 1 auto; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 8px 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-weight: 600; font-size: 16px; line-height: 1.1; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.good { background: var(--good); color: #0b1a12; border-color: transparent; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 40px; padding: 4px 12px; font-size: 14px; }
.btn.big { min-height: 64px; font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.btn[disabled] { opacity: .45; cursor: default; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions .span2 { grid-column: 1 / -1; }
.btn.play { min-height: 60px; font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.btn.play.dim { opacity: .55; }
.btn.play .sub { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 500; letter-spacing: .02em; text-transform: none; color: var(--muted); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.card.flag { border-color: var(--accent); }
.lastplay { display: flex; gap: 10px; align-items: flex-start; }
.lastplay .txt { flex: 1 1 auto; min-width: 0; }
.lastplay .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* tabs */
#tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#tabs button { background: none; border: 0; min-height: 54px; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 3px solid transparent; }
#tabs button.on { color: var(--fg); border-top-color: var(--accent); }
#tabs button[disabled] { opacity: .4; }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; top: max(28px, env(safe-area-inset-top, 0px)); z-index: 21; background: var(--bg); border-radius: 16px 16px 0 0;
  box-shadow: var(--shadow); display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 20px; }
.sheet-head .ctx { font-size: 13px; color: var(--muted); font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-weight: 500; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { display: flex; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.sheet-foot .btn { flex: 1 1 auto; }
.err { color: var(--bad); font-weight: 600; }

/* form pieces */
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > label, .lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; }
.seg button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg button.on.gold { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.seg.tight button { flex: 0 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 48px; min-width: 56px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.chip b { font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip span { font-size: 11px; color: var(--muted); max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.on span { color: var(--bg); opacity: .75; }
input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; min-height: 46px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
textarea { min-height: 96px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
input[type="color"] { width: 54px; height: 46px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.yard-input { width: 92px; min-height: 52px; text-align: center; font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.spot { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.spot .readout { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.spot .readout .delta { color: var(--accent); }
.spot .readout .delta.neg { color: var(--bad); }
.steppers { display: flex; gap: 6px; }
.steppers button { flex: 1 1 auto; min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.preview { border: 1px dashed var(--accent); border-radius: var(--radius); padding: 10px 12px; }
.preview .big { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
details.adv { border: 1px solid var(--line); border-radius: var(--radius); padding: 0 12px; }
details.adv summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--muted); }
details.adv > .stack { padding-bottom: 12px; }
.help { color: var(--muted); font-size: 14px; }

/* wizard: one question per screen */
.wiz { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.wiz-head { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 4px max(10px, env(safe-area-inset-right, 0px)) 4px max(10px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.wiz-back, .wiz-cancel { background: none; border: 0; color: var(--info); font-weight: 600; font-size: 16px; min-height: 44px; min-width: 64px; padding: 0 6px; text-align: left; }
.wiz-cancel { text-align: right; }
.wiz-title { flex: 1 1 auto; min-width: 0; text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wiz-strip { flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.wiz-strip::-webkit-scrollbar { display: none; }
.crumb { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 40px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-align: left; }
.crumb.future { opacity: .6; border-style: dashed; }
.crumb .cl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.crumb .cv { font-size: 14px; font-weight: 600; max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wiz-q { flex: 0 0 auto; font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--fg); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); }
.wiz-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
.wiz-body .stack { gap: 8px; }
.wiz-body > * { flex: 0 0 auto; }
.wiz-foot { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.wiz-foot .btn.big { width: 100%; }
.wiz-preview .big { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pchip { min-height: 62px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; padding: 4px; min-width: 0; }
.pchip b { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pchip span { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pchip.on span { color: var(--bg); opacity: .75; }
.pchip.other { border-style: dashed; }
.pchip.other b { font-size: 15px; font-family: var(--font-body); font-weight: 600; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices.one { grid-template-columns: 1fr; }
.choice { min-height: 66px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 10px; min-width: 0; }
.choice b { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: .03em; text-align: center; line-height: 1.05; }
.choice span { font-size: 12px; color: var(--muted); }
.choice.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.choice.on span { color: var(--bg); opacity: .75; }
.choice.gold.on { background: var(--accent); color: var(--accent-fg); }
.bigseg { display: flex; gap: 8px; }
.bigseg.wrap { flex-wrap: wrap; }
.bigseg button { flex: 1 1 auto; min-height: 50px; padding: 4px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: .03em; min-width: 0; }
.bigseg button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.spot-read { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.spot-read .yard { font-family: var(--font-display); font-size: 42px; font-weight: 700; line-height: 1; letter-spacing: .01em; }
.spot-read .delta { font-size: 16px; color: var(--accent); font-weight: 600; margin-top: 2px; }
.spot-read .delta.neg { color: var(--bad); }
.spot-read .dd { font-size: 15px; color: var(--muted); text-align: right; font-weight: 600; }
.spot-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.spot-right .linkbtn { padding: 2px 0; font-size: 14px; }
.ended { font-family: var(--font-display); font-size: 40px; font-weight: 700; color: var(--accent); text-align: center; padding: 24px 0; letter-spacing: .06em; }
.shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.shortcuts button { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 16px; }
.shortcuts button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.shortcuts button.gold.on { background: var(--accent); color: var(--accent-fg); }
.kp-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; user-select: none; -webkit-user-select: none; }
.kp-key { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1; }
.kp-key:active { background: var(--fg); color: var(--bg); }
.kp-key.alt { font-family: var(--font-body); font-size: 15px; font-weight: 700; }
.kp-key.alt.go { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.kp-key.bs { font-size: 20px; }
.kp-key[disabled] { opacity: .3; }
.kp-big { font-family: var(--font-display); font-size: 40px; font-weight: 700; text-align: center; }
.kp-keys.wide { grid-template-columns: 1.15fr 1fr 1fr 1fr; }
.kp-key.team { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-top: 4px solid var(--team); }
.kp-key.team b { font-size: 20px; letter-spacing: .04em; }
.kp-key.team span { font-family: var(--font-body); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kp-key.team.on { background: var(--fg); color: var(--bg); border-color: var(--fg); border-top-color: var(--team); }
.kp-key.team.on span { color: var(--bg); opacity: .75; }
.kp-key.pressed { background: var(--fg); color: var(--bg); }
.kp-keys.shake { animation: kp-shake .3s; }
@keyframes kp-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.wiz input[type="text"] { font-size: 18px; min-height: 52px; }

/* log */
.qhead { font-family: var(--font-display); font-size: 16px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 14px 0 4px; border-bottom: 1px solid var(--line); }
.drive-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); padding: 10px 0 2px; }
.drive-head b { color: var(--fg); font-family: var(--font-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.ev { display: grid; grid-template-columns: 24px 1fr; gap: 8px; width: 100%; text-align: left; padding: 8px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); align-items: start; }

.ev .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }

/* stats */

.teamtabs { display: flex; gap: 6px; }

/* games list */

<body>
<div id="app">
  <header id="scoreboard" hidden></header>
  <main id="view"></main>
  <nav id="tabs" aria-label="Sections"></nav>
</div>
<div id="toast" role="status" hidden></div>
<script>
/* Chain Crew engine — pure game logic.
   The game is an ordered list of events the stat keeper typed. Every piece of
   derived state (score, down, distance, ball spot, possession, quarter, stats)
   is recomputed by replaying the events from the start, so editing, deleting or
   inserting any event is always safe.

   Field model: an absolute coordinate 0..L where 0 is the HOME goal line (the
   end zone HOME defends) and L is the AWAY goal line. HOME advances toward L,
   AWAY advances toward 0. The physical direction of play (left/right from the
   stat keeper's seat) is purely a display concern and never touches the data. */
(function (root) {
  'use strict';

  const PLAY_TYPES = { kickoff: 1, rush: 1, pass: 1, punt: 1, fg: 1, pat: 1 };
  const SCRIMMAGE = { rush: 1, pass: 1 };

  const PENALTY_PRESETS = [
    { name: 'False start', side: 'off', yards: 5, from: 'current', down: 'keep' },
    { name: 'Delay of game', side: 'off', yards: 5, from: 'current', down: 'keep' },
    { name: 'Encroachment / offside', side: 'def', yards: 5, from: 'current', down: 'keep' },
    { name: 'Illegal formation / shift / motion', side: 'off', yards: 5, from: 'previous', down: 'keep' },
    { name: 'Too many players', side: 'any', yards: 5, from: 'current', down: 'keep' },
    { name: 'Holding (offense)', side: 'off', yards: 10, from: 'previous', down: 'keep' },
    { name: 'Holding (defense)', side: 'def', yards: 10, from: 'previous', down: 'keep' },
    { name: 'Illegal block', side: 'any', yards: 10, from: 'previous', down: 'keep' },
    { name: 'Pass interference (offense)', side: 'off', yards: 15, from: 'previous', down: 'keep' },
    { name: 'Pass interference (defense)', side: 'def', yards: 15, from: 'previous', down: 'keep' },
    { name: 'Intentional grounding', side: 'off', yards: 5, from: 'previous', down: 'loss' },
    { name: 'Illegal forward pass', side: 'off', yards: 5, from: 'previous', down: 'loss' },
    { name: 'Roughing the passer', side: 'def', yards: 15, from: 'current', down: 'auto' },
    { name: 'Roughing the kicker', side: 'def', yards: 15, from: 'previous', down: 'auto' },
    { name: 'Running into the kicker', side: 'def', yards: 5, from: 'previous', down: 'keep' },
    { name: 'Personal foul', side: 'any', yards: 15, from: 'current', down: 'keep' },
    { name: 'Unsportsmanlike conduct', side: 'any', yards: 15, from: 'current', down: 'keep' },
    { name: 'Facemask', side: 'any', yards: 15, from: 'current', down: 'keep' },
    { name: 'Horse-collar tackle', side: 'def', yards: 15, from: 'current', down: 'keep' },
    { name: 'Chop block / clipping', side: 'off', yards: 15, from: 'previous', down: 'keep' },
    { name: 'Illegal participation', side: 'any', yards: 15, from: 'previous', down: 'keep' },
    { name: 'Kick-catch interference', side: 'any', yards: 15, from: 'current', down: 'keep' },
    { name: 'Targeting', side: 'any', yards: 15, from: 'current', down: 'keep' },
    { name: 'Other', side: 'any', yards: 10, from: 'current', down: 'keep' }
  ];

  const DEFAULT_SETTINGS = {
    fieldLength: 100, kickoffSpot: 40, touchbackSpot: 20, safetyKickSpot: 20, trySpot: 3,
    ptsTD: 6, ptsFG: 3, ptsKick: 1, pts2pt: 2, ptsSafety: 2,
    firstDownYards: 10, timeoutsPerHalf: 3, quarters: 4, quarterMinutes: 12,
    sackCountsAsRush: true, kneelCountsAsRush: true,
    myTeam: 'home', trackOpponents: true, askClock: true
  };

  function dir(team) { return team === 'home' ? 1 : -1; }
  function opp(team) { return team === 'home' ? 'away' : 'home'; }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function half(x) { return Math.round(x * 2) / 2; }
  function num(x, d) { const n = Number(x); return Number.isFinite(n) ? n : d; }
  function goal(team, L) { return team === 'home' ? L : 0; }
  function ownGoal(team, L) { return team === 'home' ? 0 : L; }
  function gain(team, from, to) { return (to - from) * dir(team); }
  function toGoal(team, spot, L) { return (goal(team, L) - spot) * dir(team); }
  function reached(team, spot, ltg) { return ltg != null && (spot - ltg) * dir(team) >= 0; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function settingsOf(game) { return Object.assign({}, DEFAULT_SETTINGS, game.settings || {}); }
  function kickSpotFor(team, game, kind) {
    const S = settingsOf(game), L = S.fieldLength;
    const y = kind === 'safety' ? S.safetyKickSpot : S.kickoffSpot;
    return team === 'home' ? y : L - y;
  }
  function touchbackSpot(team, game) {
    const S = settingsOf(game), L = S.fieldLength;
    return team === 'home' ? S.touchbackSpot : L - S.touchbackSpot;
  }
  function trySpot(team, game) {
    const S = settingsOf(game), L = S.fieldLength;
    return goal(team, L) - S.trySpot * dir(team);
  }

  /* ---------- spot formatting ---------- */
  // absolute -> {side:'home'|'away'|'mid', yard}
  function spotParts(abs, L) {
    const m = L / 2;
    if (Math.abs(abs - m) < 1e-9) return { side: 'mid', yard: m };
    if (abs < m) return { side: 'home', yard: abs };
    return { side: 'away', yard: L - abs };
  }
  function fmtYard(y) { return Number.isInteger(y) ? String(y) : y.toFixed(1).replace('.0', ''); }
  function fmtSpot(abs, game) {
    const L = settingsOf(game).fieldLength;
    if (abs == null || !Number.isFinite(abs)) return '—';
    if (abs <= 0) return (game.teams.home.abbr || 'HOME') + ' goal line';
    if (abs >= L) return (game.teams.away.abbr || 'AWAY') + ' goal line';
    const p = spotParts(abs, L);
    if (p.side === 'mid') return fmtYard(p.yard);
    return (game.teams[p.side].abbr || p.side.toUpperCase()) + ' ' + fmtYard(p.yard);
  }
  // side ('home'|'away') + yard (0..L/2) -> absolute
  function absFrom(side, yard, L) {
    const y = clamp(num(yard, 0), 0, L / 2);
    return side === 'home' ? y : L - y;
  }

  /* ---------- state ---------- */
  function makeState(game) {
    const S = settingsOf(game), L = S.fieldLength;
    const recv = (game.start && game.start.receivesFirst) || 'home';
    const kick = opp(recv);
    return {
      L, quarter: 1, phase: 'kickoff', possession: kick, kickTeam: kick,
      spot: kickSpotFor(kick, game, 'kickoff'), down: 1, lineToGain: null,
      score: { home: 0, away: 0 },
      timeouts: { home: S.timeoutsPerHalf, away: S.timeoutsPerHalf },
      snapshot: null, snapshotIndex: -1,
      driveNo: 0, driveTeam: null, driveStart: null, drivePlays: 0,
      final: false, note: ''
    };
  }

  function setFirstDown(st, team, spot) {
    const L = st.L;
    spot = clamp(spot, 0, L);
    if (st.possession !== team || st.phase !== 'play') beginDrive(st, team, spot);
    st.possession = team; st.phase = 'play'; st.kickTeam = null;
    st.down = 1; st.spot = spot;
    let ltg = spot + 10 * dir(team);
    if ((goal(team, L) - ltg) * dir(team) <= 0) ltg = goal(team, L);
    st.lineToGain = ltg;
  }
  function beginDrive(st, team, spot) {
    st.driveNo += 1; st.driveTeam = team; st.driveStart = spot; st.drivePlays = 0;
  }
  function setTry(st, team, game) {
    st.phase = 'try'; st.possession = team; st.kickTeam = null;
    st.spot = trySpot(team, game); st.down = 1; st.lineToGain = null;
  }
  function setKickoff(st, team, game, kind) {
    st.phase = kind === 'safety' ? 'free_kick' : 'kickoff';
    st.possession = team; st.kickTeam = team;
    st.spot = kickSpotFor(team, game, kind); st.down = 1; st.lineToGain = null;
  }
  // a scrimmage play ended with possession retained at `end`
  function afterScrimmage(st, team, end, flags) {
    const L = st.L; end = clamp(end, 0, L);
    st.spot = end;
    if (reached(team, end, st.lineToGain)) { flags.firstDown = true; setFirstDown(st, team, end); return; }
    st.down += 1;
    if (st.down > 4) { flags.downs = true; setFirstDown(st, opp(team), end); }
  }

  /* ---------- stats deltas ---------- */
  function D(list, team, nm, stat, val) { list.push({ team, num: nm == null ? null : String(nm), stat, val: val == null ? 1 : val }); }
  function TD_(list, team, nm, stat, val) { D(list, team, null, stat, val); if (nm != null) D(list, team, nm, stat, val); }

  function addScore(st, team, pts, deltas, flags) {
    st.score[team] += pts;
    const q = st.quarter >= 5 ? 'ot' : 'q' + st.quarter;
    D(deltas, team, null, 'pts', pts);
    D(deltas, team, null, 'pts_' + q, pts);
    flags.scored = team; flags.pts = (flags.pts || 0) + pts;
  }
  function tackleCredit(deltas, defTeam, tacklers, yards, isSack) {
    const t = (tacklers || []).filter(x => x != null && x !== '');
    if (!t.length) return;
    const share = t.length === 1 ? 1 : 0.5;
    t.forEach(n => {
      D(deltas, defTeam, n, t.length === 1 ? 'tackSolo' : 'tackAst');
      if (yards < 0) { D(deltas, defTeam, n, 'tfl', share); D(deltas, defTeam, n, 'tflYds', -yards * share); }
      if (isSack) { D(deltas, defTeam, n, 'sacks', share); D(deltas, defTeam, n, 'sackYds', -yards * share); }
    });
  }
  function downTracking(before, deltas, team, converted) {
    if (before.phase !== 'play') return;
    if (before.down === 3) { D(deltas, team, null, 'thirdAtt'); if (converted) D(deltas, team, null, 'thirdConv'); }
    if (before.down === 4) { D(deltas, team, null, 'fourthAtt'); if (converted) D(deltas, team, null, 'fourthConv'); }
  }

  // resolve a fumble on a play; returns true if possession changed hands
  function applyFumble(st, game, deltas, flags, team, fumbler, f, fumbleSpot) {
    const L = st.L;
    D(deltas, team, fumbler, 'fumbles');
    const recTeam = (f && f.recTeam) || opp(team);
    const forcedBy = f && f.forcedBy;
    if (forcedBy && recTeam !== team) D(deltas, opp(team), forcedBy, 'ff');
    else if (forcedBy) D(deltas, opp(team), forcedBy, 'ff');
    const recSpot = clamp(num(f && f.recSpot, fumbleSpot), 0, L);
    if (f && f.recBy != null && f.recBy !== '') D(deltas, recTeam, f.recBy, 'fr');
    if (recTeam === team) {
      flags.fumbleKept = true;
      afterScrimmage(st, team, recSpot, flags);
      return false;
    }
    D(deltas, team, fumbler, 'fumblesLost');
    D(deltas, team, null, 'turnovers');
    flags.turnover = 'fumble';
    const retEnd = f && f.td ? goal(recTeam, L) : clamp(num(f && f.retSpot, recSpot), 0, L);
    const retYds = gain(recTeam, recSpot, retEnd);
    if (f && f.recBy != null && f.recBy !== '' && retYds) D(deltas, recTeam, f.recBy, 'frYds', retYds);
    if (f && !f.td) tackleCredit(deltas, team, f.retTacklers, 0, false);
    if (f && f.td) {
      if (f.recBy != null && f.recBy !== '') { D(deltas, recTeam, f.recBy, 'defTD'); D(deltas, recTeam, f.recBy, 'points', settingsOf(game).ptsTD); }
      addScore(st, recTeam, settingsOf(game).ptsTD, deltas, flags);
      flags.td = recTeam;
      setTry(st, recTeam, game);
    } else setFirstDown(st, recTeam, retEnd);
    return true;
  }

  /* ---------- event application ---------- */
  function applyEvent(st, ev, game, idx, derived) {
    const S = settingsOf(game), L = st.L;
    const deltas = [], flags = {};
    const before = clone(st);
    const type = ev.type;

    if (PLAY_TYPES[type]) { st.snapshot = before; st.snapshotIndex = idx; }

    switch (type) {
      case 'rush': {
        const team = ev.team || st.possession || 'home';
        if (st.phase !== 'play' || st.possession !== team) { st.phase = 'play'; st.possession = team; st.kickTeam = null; if (st.lineToGain == null) { let l = st.spot + 10 * dir(team); if ((goal(team, L) - l) * dir(team) <= 0) l = goal(team, L); st.lineToGain = l; } }
        st.drivePlays = (st.drivePlays || 0) + 1;
        const def = opp(team), start = st.spot;
        let end;
        if (ev.result === 'td') end = goal(team, L);
        else if (ev.result === 'safety') end = ownGoal(team, L);
        else if (ev.mode === 'yards') end = start + num(ev.yards, 0) * dir(team);
        else end = num(ev.endSpot, start);
        end = clamp(end, 0, L);
        const yards = gain(team, start, end);
        flags.yards = yards; flags.start = start; flags.end = end;
        const counts = !ev.kneel || S.kneelCountsAsRush;
        if (counts) {
          TD_(deltas, team, ev.carrier, 'rushAtt'); TD_(deltas, team, ev.carrier, 'rushYds', yards);
          if (ev.carrier != null) D(deltas, team, ev.carrier, 'rushLong', yards);
          D(deltas, team, null, 'plays');
        }
        if (ev.result !== 'td' && ev.result !== 'safety') tackleCredit(deltas, def, ev.tacklers, yards, false);
        if (ev.result === 'td') {
          if (ev.carrier != null) { D(deltas, team, ev.carrier, 'rushTD'); D(deltas, team, ev.carrier, 'points', S.ptsTD); }
          D(deltas, team, null, 'rushTD');
          D(deltas, team, null, 'firstDowns'); D(deltas, team, null, 'firstDownsRush');
          downTracking(before, deltas, team, true);
          addScore(st, team, S.ptsTD, deltas, flags); flags.td = team;
          setTry(st, team, game);
        } else if (ev.result === 'safety') {
          tackleCredit(deltas, def, ev.tacklers, -1, false);
          addScore(st, def, S.ptsSafety, deltas, flags); flags.safety = def;
          downTracking(before, deltas, team, false);
          setKickoff(st, team, game, 'safety');
        } else if (ev.result === 'fumble') {
          const changed = applyFumble(st, game, deltas, flags, team, ev.carrier, ev.fumble, end);
          if (!changed && flags.firstDown) { D(deltas, team, null, 'firstDowns'); D(deltas, team, null, 'firstDownsRush'); }
          downTracking(before, deltas, team, !changed && !!flags.firstDown);
        } else {
          afterScrimmage(st, team, end, flags);
          if (flags.firstDown) { D(deltas, team, null, 'firstDowns'); D(deltas, team, null, 'firstDownsRush'); }
          downTracking(before, deltas, team, !!flags.firstDown);
        }
        break;
      }
      case 'pass': {
        const team = ev.team || st.possession || 'home';
        if (st.phase !== 'play' || st.possession !== team) { st.phase = 'play'; st.possession = team; st.kickTeam = null; if (st.lineToGain == null) { let l = st.spot + 10 * dir(team); if ((goal(team, L) - l) * dir(team) <= 0) l = goal(team, L); st.lineToGain = l; } }
        st.drivePlays = (st.drivePlays || 0) + 1;
        const def = opp(team), start = st.spot;
        const res = ev.spike ? 'incomplete' : ev.result;
        flags.start = start;
        if (res === 'complete') {
          let end = ev.result === 'complete' && ev.td ? goal(team, L) : (ev.mode === 'yards' ? start + num(ev.yards, 0) * dir(team) : num(ev.endSpot, start));
          if (ev.safety) end = ownGoal(team, L);
          end = clamp(end, 0, L);
          const yards = gain(team, start, end);
          flags.yards = yards; flags.end = end;
          TD_(deltas, team, ev.passer, 'passAtt'); TD_(deltas, team, ev.passer, 'passComp'); TD_(deltas, team, ev.passer, 'passYds', yards);
          if (ev.passer != null) D(deltas, team, ev.passer, 'passLong', yards);
          if (ev.receiver != null && ev.receiver !== '') { D(deltas, team, ev.receiver, 'rec'); D(deltas, team, ev.receiver, 'recYds', yards); D(deltas, team, ev.receiver, 'recLong', yards); D(deltas, team, ev.receiver, 'targets'); }
          D(deltas, team, null, 'plays');
          if (ev.td) {
            if (ev.passer != null) D(deltas, team, ev.passer, 'passTD');
            if (ev.receiver != null && ev.receiver !== '') { D(deltas, team, ev.receiver, 'recTD'); D(deltas, team, ev.receiver, 'points', S.ptsTD); }
            D(deltas, team, null, 'passTD'); D(deltas, team, null, 'firstDowns'); D(deltas, team, null, 'firstDownsPass');
            downTracking(before, deltas, team, true);
            addScore(st, team, S.ptsTD, deltas, flags); flags.td = team;
            setTry(st, team, game);
          } else if (ev.safety) {
            tackleCredit(deltas, def, ev.tacklers, -1, false);
            addScore(st, def, S.ptsSafety, deltas, flags); flags.safety = def;
            downTracking(before, deltas, team, false);
            setKickoff(st, team, game, 'safety');
          } else if (ev.fumble && ev.fumble.on) {

    const events = game.events || [];
    const derived = [];
    const states = [];
    for (let i = 0; i < events.length; i++) {
      const ev = events[i];
      const d = { nullified: false };
      derived.push(d);
      let r;
      try { r = applyEvent(st, ev, game, i, derived); }
      catch (e) { r = { deltas: [], flags: { error: String(e && e.message || e) }, before: clone(st) }; }
      d.before = r.before; d.flags = r.flags; d.deltas = r.deltas;
      d.after = clone(st);
      d.driveNo = st.driveNo;
      d.text = describe(ev, r.before, d.after, r.flags, game);
      states.push(d.after);
    }
    const stats = computeStats(game, derived);
    const drives = computeDrives(game, derived);
    const top = computeTOP(game, derived);
    return { final: clone(st), derived, states, stats, drives, top };
  }

  // state just before event index i (or final state when i == events.length)
  function stateBefore(game, i) {
    const g = Object.assign({}, game, { events: (game.events || []).slice(0, i) });
    return replay(g).final;
  }

  const MAX_STATS = { rushLong: 1, passLong: 1, recLong: 1, puntLong: 1, prLong: 1, krLong: 1, fgLong: 1 };

  function computeStats(game, derived) {
    const out = { home: { team: {}, players: {} }, away: { team: {}, players: {} } };
    derived.forEach(d => {
      if (d.nullified) return;
      (d.deltas || []).forEach(x => {
        const bucket = x.num == null ? out[x.team].team : (out[x.team].players[x.num] = out[x.team].players[x.num] || {});
        if (MAX_STATS[x.stat]) bucket[x.stat] = Math.max(bucket[x.stat] == null ? -Infinity : bucket[x.stat], x.val);
        else bucket[x.stat] = (bucket[x.stat] || 0) + x.val;
      });
    });
    ['home', 'away'].forEach(t => {
      const T = out[t].team;
      T.totalYds = (T.rushYds || 0) + (T.passYds || 0);
      T.totalPlays = (T.rushAtt || 0) + (T.passAtt || 0);

    return out;
  }

  function computeDrives(game, derived) {
    const drives = [];
    let cur = null;
    derived.forEach((d, i) => {
      const ev = game.events[i];
      if (!ev || d.nullified) return;
      if (ev.type === 'rush' || ev.type === 'pass' || ev.type === 'punt' || ev.type === 'fg') {
        const team = d.before.possession;
        if (!cur || cur.no !== d.before.driveNo || cur.team !== team) {
          cur = { no: d.before.driveNo, team, start: d.before.spot, quarter: d.before.quarter, plays: 0, yards: 0, result: '', first: i, last: i };
          drives.push(cur);

        cur.last = i;
        if (ev.type === 'rush' || ev.type === 'pass') { cur.plays += 1; cur.yards += d.flags.yards || 0; }
        const f = d.flags;
        if (f.td === team) cur.result = 'TD';
        else if (f.fg) cur.result = 'FG';
        else if (ev.type === 'punt') cur.result = f.blocked ? 'Blocked punt' : 'Punt';
        else if (f.missed || (ev.type === 'fg' && f.blocked)) cur.result = 'Missed FG';
        else if (f.turnover === 'int') cur.result = 'INT';
        else if (f.turnover === 'fumble') cur.result = 'Fumble';
        else if (f.downs) cur.result = 'Downs';
        else if (f.safety) cur.result = 'Safety';
      } else if (ev.type === 'period_end' && cur && (d.before.quarter === 2 || d.flags.endedQuarter >= 4)) {
        if (!cur.result) cur.result = 'End of half';
        cur = null;
      }

    return drives;
  }

  /* ---------- game clock & time of possession ----------
     A clock reading is the time left in the quarter when a play was snapped (or when a Clock entry
     was made). Between two readings, the elapsed time is credited to the team with the ball, split by
     scrimmage-play count when both teams ran plays in that span. Quarter ends are implicit readings. */
  function parseClock(v) {
    if (v == null) return null;
    const s = String(v).trim(); if (!s) return null;
    let m = /^(\d{1,2}):(\d{2})$/.exec(s); if (m) return Number(m[1]) * 60 + Number(m[2]);
    m = /^(\d{1,2})(\d{2})$/.exec(s); if (m) return Number(m[1]) * 60 + Number(m[2]);
    m = /^(\d{1,2})$/.exec(s); if (m) return Number(m[1]);
    return null;
  }
  function fmtClock(sec) { sec = Math.max(0, Math.round(num(sec, 0))); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  function computeTOP(game, derived) {
    const S = settingsOf(game), Q = (S.quarterMinutes || 12) * 60;
    const events = game.events || [];
    const absTime = (quarter, remaining) => (Math.max(1, quarter) - 1) * Q + (Q - clamp(remaining, 0, Q));
    // a reading at index i is the clock as of the start of event i; a play's end reading (clockEnd) is as of the start of event i+1
    const pts = [];
    events.forEach((ev, i) => {
      const d = derived[i]; if (!d) return;
      const q = d.before.quarter;
      if (i === 0 && (ev.type === 'kickoff' || ev.type === 'clock')) pts.push({ i, t: absTime(q, Q), explicit: false });
      const c = parseClock(ev.clock);
      if (c != null) pts.push({ i, t: absTime(q, c), explicit: true });
      const ce = parseClock(ev.clockEnd);
      if (ce != null) pts.push({ i: i + 1, t: absTime(d.after.quarter, ce), explicit: true });
      if (ev.type === 'period_end' || ev.type === 'game_end') pts.push({ i, t: absTime(q, 0), explicit: false });
    });
    pts.sort((a, b) => a.i - b.i || a.t - b.t);
    // who the clock is running for during event i: the receiving team on a kick, otherwise whoever has the ball at the snap
    const during = i => { const ev = events[i], d = derived[i]; if (!d) return null; if (ev.type === 'kickoff') return opp(d.before.kickTeam || d.before.possession); return d.before.possession; };
    const top = { home: 0, away: 0 };
    let explicit = 0, approx = false; pts.forEach(p => { if (p.explicit) explicit++; });
    for (let k = 0; k + 1 < pts.length; k++) {
      const A = pts[k], B = pts[k + 1];
      const el = B.t - A.t; if (el <= 0 || B.i <= A.i) continue;
      if (!A.explicit && !B.explicit) approx = true; // a span with no reading at either end is split by play count
      const counts = { home: 0, away: 0 }; let any = 0;
      const others = { home: 0, away: 0 }; let anyOther = 0;
      for (let i = A.i; i < B.i; i++) {
        const ev = events[i], d = derived[i]; if (!d || d.nullified) continue;
        if (ev.type === 'rush' || ev.type === 'pass') { counts[d.before.possession] += 1; any++; }
        else if (ev.type === 'punt' || ev.type === 'kickoff' || ev.type === 'fg') { const t = during(i); if (t) { others[t] += 1; anyOther++; } }
      }
      if (any) { top.home += el * counts.home / any; top.away += el * counts.away / any; }
      else if (anyOther) { top.home += el * others.home / anyOther; top.away += el * others.away / anyOther; }
      else { const t = during(A.i); const d = derived[A.i]; if (t && d && d.before.phase !== 'final') top[t] += el; }
    }
    return { home: Math.round(top.home), away: Math.round(top.away), clocks: explicit, reliable: explicit >= 2, approx };
  }

  /* ---------- descriptions ---------- */
  function pname(game, team, n) {
    if (n == null || n === '') return '';

    return p && p.name ? '#' + n + ' ' + p.name : '#' + n;
  }
  function ydsTxt(y) { return (y === 1 || y === -1) ? y + ' yd' : y + ' yds'; }
  function dd(st, game) {
    if (!st) return '';

    if (st.phase === 'free_kick') return 'Free kick';
    if (st.phase === 'try') return 'Try';
    if (st.phase === 'final') return 'Final';

    const dist = st.lineToGain == null ? '' : (Math.abs(st.lineToGain - goal(st.possession, L)) < 1e-9 ? 'Goal' : fmtYard(Math.abs(st.lineToGain - st.spot)));

  function ordinal(n) { return ['', '1st', '2nd', '3rd', '4th'][n] || n + 'th'; }
  function tacklersTxt(game, def, t) {
    const l = (t || []).filter(x => x != null && x !== '').map(n => pname(game, def, n));
    return l.length ? ' (tackle: ' + l.join(', ') + ')' : '';
  }
  function describe(ev, before, after, f, game) {
    const ab = t => game.teams[t].abbr || t.toUpperCase();
    const team = ev.team || (before && before.possession) || 'home';
    const def = opp(team);
    let s = '';
    switch (ev.type) {
      case 'rush': {
        s = (ev.kneel ? pname(game, team, ev.carrier) + ' kneels' : pname(game, team, ev.carrier) + ' rush') + (ev.kneel ? '' : ' for ' + ydsTxt(f.yards));
        if (ev.result === 'td') s += ', TOUCHDOWN ' + ab(team);
        else if (ev.result === 'safety') s += ', SAFETY';
        else if (ev.result === 'fumble') s += ' to the ' + fmtSpot(f.end, game) + ', FUMBLE' + fumbleTxt(game, team, ev.fumble, f);
        else s += ' to the ' + fmtSpot(f.end, game) + (ev.result === 'oob' ? ', out of bounds' : '') + tacklersTxt(game, def, ev.tacklers);
        break;
      }
      case 'pass': {
        const P = pname(game, team, ev.passer);
        if (ev.spike) s = P + ' spikes the ball (incomplete)';
        else if (ev.result === 'complete') {
          s = P + ' pass complete to ' + pname(game, team, ev.receiver) + ' for ' + ydsTxt(f.yards);
          if (ev.td) s += ', TOUCHDOWN ' + ab(team);
          else if (ev.safety) s += ', SAFETY';
          else if (ev.fumble && ev.fumble.on) s += ' to the ' + fmtSpot(f.end, game) + ', FUMBLE' + fumbleTxt(game, team, ev.fumble, f);
          else s += ' to the ' + fmtSpot(f.end, game) + tacklersTxt(game, def, ev.tacklers);
        } else if (ev.result === 'incomplete') {
          s = P + ' pass incomplete' + (ev.receiver ? ' intended for ' + pname(game, team, ev.receiver) : '');
          const pb = (ev.pbu || []).filter(x => x != null && x !== '');
          if (pb.length) s += ' (broken up by ' + pb.map(n => pname(game, def, n)).join(', ') + ')';
        } else if (ev.result === 'intercepted') {
          s = P + ' pass INTERCEPTED by ' + pname(game, def, ev.interceptor) + ' at the ' + fmtSpot(f.intSpot, game);
          if (ev.intTouchback) s += ', touchback';
          else if (ev.intTd) s += ', returned ' + ydsTxt(f.intYds) + ' for a TOUCHDOWN ' + ab(def);
          else if (f.intYds) s += ', returned ' + ydsTxt(f.intYds) + ' to the ' + fmtSpot(f.intEnd, game);
          if (!ev.intTouchback && !ev.intTd) s += tacklersTxt(game, team, ev.retTacklers);
        } else if (ev.result === 'sack') {
          s = P + ' sacked for ' + ydsTxt(f.yards) + (ev.safety ? ', SAFETY' : ' to the ' + fmtSpot(f.end, game)) + tacklersTxt(game, def, ev.tacklers);
          if (ev.fumble && ev.fumble.on) s += ', FUMBLE' + fumbleTxt(game, team, ev.fumble, f);
        }

      }
      case 'punt': {
        const R = def;
        if (ev.result === 'blocked') { s = pname(game, team, ev.punter) + ' punt BLOCKED' + (ev.blockedBy ? ' by ' + pname(game, R, ev.blockedBy) : '') + ', recovered by ' + ab(ev.recTeam || R) + (ev.recBy ? ' ' + pname(game, ev.recTeam || R, ev.recBy) : '') + ' at the ' + fmtSpot(f.end, game) + (ev.td ? ', TOUCHDOWN' : ''); break; }
        s = pname(game, team, ev.punter) + ' punt ' + ydsTxt(f.puntYds);
        if (ev.result === 'touchback') s += ', touchback';
        else if (ev.result === 'fair_catch') s += ' to the ' + fmtSpot(f.landing, game) + ', fair catch' + (ev.returner ? ' by ' + pname(game, R, ev.returner) : '');
        else if (ev.result === 'downed') s += ', downed at the ' + fmtSpot(f.landing, game);
        else if (ev.result === 'oob') s += ', out of bounds at the ' + fmtSpot(f.landing, game);
        else if (ev.result === 'muff') s += ' to the ' + fmtSpot(f.landing, game) + ', MUFFED, recovered by ' + ab(ev.recTeam || team) + (ev.recBy ? ' ' + pname(game, ev.recTeam || team, ev.recBy) : '') + ' at the ' + fmtSpot(f.end, game);
        else if (ev.result === 'return') {
          s += ' to the ' + fmtSpot(f.landing, game) + ', ' + pname(game, R, ev.returner) + ' return ' + ydsTxt(f.retYds);
          if (ev.td) s += ' for a TOUCHDOWN ' + ab(R);
          else if (ev.fumble && ev.fumble.on) s += ', FUMBLE' + fumbleTxt(game, R, Object.assign({ recTeam: team }, ev.fumble), f);
          else s += ' to the ' + fmtSpot(f.end, game) + tacklersTxt(game, team, ev.retTacklers);
        }
        break;
      }
      case 'kickoff': {
        const K = team, R = def;
        s = pname(game, K, ev.kicker) + ' kickoff ' + ydsTxt(f.kickYds);
        if (ev.result === 'touchback') s += ', touchback';
        else if (ev.result === 'fair_catch') s += ' to the ' + fmtSpot(f.landing, game) + ', fair catch';
        else if (ev.result === 'oob') s += ', out of bounds, ' + ab(R) + ' ball at the ' + fmtSpot(f.end, game);
        else if (ev.result === 'onside') s += ', ONSIDE, recovered by ' + ab(f.recTeam || K) + (ev.recBy ? ' ' + pname(game, f.recTeam || K, ev.recBy) : '') + ' at the ' + fmtSpot(f.end, game);
        else if (ev.result === 'muff') s += ' to the ' + fmtSpot(f.landing, game) + ', MUFFED, recovered by ' + ab(f.recTeam || K) + ' at the ' + fmtSpot(f.end, game);
        else if (ev.result === 'return') {
          s += ' to the ' + fmtSpot(f.landing, game) + ', ' + pname(game, R, ev.returner) + ' return ' + ydsTxt(f.retYds);
          if (ev.td) s += ' for a TOUCHDOWN ' + ab(R);
          else if (ev.fumble && ev.fumble.on) s += ', FUMBLE' + fumbleTxt(game, R, Object.assign({ recTeam: K }, ev.fumble), f);
          else s += ' to the ' + fmtSpot(f.end, game) + tacklersTxt(game, K, ev.retTacklers);
        } else s += ' to the ' + fmtSpot(f.landing, game);
        break;
      }
      case 'fg': {
        s = pname(game, team, ev.kicker) + ' ' + f.distance + ' yd field goal ';
        if (ev.result === 'good') s += 'GOOD';
        else if (ev.result === 'blocked') s += 'BLOCKED' + (ev.blockedBy ? ' by ' + pname(game, def, ev.blockedBy) : '') + ', ' + ab(ev.recTeam || def) + ' ball at the ' + fmtSpot(f.end, game);
        else s += 'NO GOOD' + (f.touchback ? ', touchback' : ', ' + ab(def) + ' ball at the ' + fmtSpot(after.spot, game));
        break;
      }
      case 'pat': {
        if (ev.kind === 'kick') s = pname(game, team, ev.kicker) + ' PAT kick ' + (f.good ? 'GOOD' : (ev.result === 'blocked' ? 'BLOCKED' : 'NO GOOD'));
        else if (ev.kind === 'run') s = '2-pt conversion: ' + pname(game, team, ev.carrier) + ' rush ' + (f.good ? 'GOOD' : 'FAILED');
        else s = '2-pt conversion: ' + pname(game, team, ev.passer) + ' pass to ' + pname(game, team, ev.receiver) + ' ' + (f.good ? 'GOOD' : 'FAILED');
        break;
      }
      case 'penalty': {
        s = 'PENALTY on ' + ab(ev.against === 'away' ? 'away' : 'home') + (ev.player ? ' ' + pname(game, ev.against === 'away' ? 'away' : 'home', ev.player) : '') + ': ' + (ev.name || 'penalty');
        if (ev.status === 'declined') s += ', declined';
        else if (ev.status === 'offsetting') s += ', offsetting' + (f.nullified ? ', replay the down' : '');
        else {
          s += ', ' + ydsTxt(f.yards) + (f.halfDistance ? ' (half the distance)' : '');
          if (f.nullified) s += ', previous play wiped out';
          if (f.firstDown) s += ', automatic 1st down';
          if (ev.downResult === 'loss') s += ', loss of down';

        break;
      }
      case 'timeout': s = 'Timeout ' + ab(ev.team || team) + ' (' + after.timeouts[ev.team || team] + ' left)'; break;
      case 'period_end': s = f.overtime ? 'End of regulation — overtime' : (after.final ? 'FINAL' : 'End of quarter ' + f.endedQuarter); break;
      case 'situation': s = 'Situation set: ' + dd(after, game) + (ev.note ? ' — ' + ev.note : ''); break;
      case 'safety': s = 'SAFETY, 2 points ' + ab(ev.team || opp(team)); break;
      case 'game_end': s = 'FINAL'; break;
      case 'clock': s = 'Clock ' + fmtClock(parseClock(ev.clock) || 0) + (ev.note ? ' — ' + ev.note : ''); break;
      case 'note': s = ev.text || 'Note'; break;
    }
    if (f && f.downs) s += '. Turnover on downs';
    if (f && f.firstDown && ev.type !== 'penalty') s += '. 1st down';
    return s;
  }

    if (fu.recSpot != null && fu.recSpot !== '') s += ' at the ' + fmtSpot(Number(fu.recSpot), game);
    if (fu.td) s += ', returned for a TOUCHDOWN';
    else if (fu.retSpot != null && fu.retSpot !== '' && Number(fu.retSpot) !== Number(fu.recSpot)) s += ', returned to the ' + fmtSpot(Number(fu.retSpot), game);
    if (!fu.td && rt !== team) s += tacklersTxt(game, team, fu.retTacklers);

  /* ---------- roster text parsing ----------
     Accepts: "12 John Smith QB" lines; tab/comma rows copied from a MaxPreps roster page
     (# Player Grade Position Height Weight); one cell per line (phone copies); and CSV
     files with a header row (Number, First Name, Last Name, Position1, ...). */
  function parseRoster(text) {

    const isHeight = c => /^(\d'\s?\d{1,2}"?|\d-\d{1,2}|-|—)$/.test(c);

    const isJunk = c => c === '' || isGrade(c) || isHeight(c) || isWeight(c) || /^(yes|no|captain|c)$/i.test(c);
    if (!lines.length) return [];

    const delim0 = lines[0].includes('\t') ? '\t' : (lines[0].split(',').length >= 3 ? ',' : null);
    const header = delim0 ? lines[0].split(delim0).map(c => strip(c).toLowerCase()) : null;
    const hasH = header && header.some(c => /player|name|first|last/.test(c)) && header.some(c => /^#$|number|^no\.?$|jersey/.test(c));
    if (hasH) {

      lines.slice(1).forEach(line => {
        const cells = line.split(delim0).map(strip);
        const num = cells[iNum];

    }
    let pending = null;
    const flush = () => { if (pending) push(pending.num, pending.name, pending.pos); pending = null; };
    lines.forEach(line => {
      let m;
      if ((m = /^#?(\d{1,3})$/.exec(line))) { flush(); pending = { num: m[1], name: '', pos: '' }; return; }
      if (pending && isJunk(line)) return;
      if ((m = /^#?(\d{1,3})\s*[\t,;|]\s*(.+)$/.exec(line)) || (m = /^#?(\d{1,3})\s+(\S.*)$/.exec(line))) {
        flush();

        const cells = /[\t,;|]/.test(rest) ? rest.split(/\t|\s*[;|]\s*|,(?=\s*[A-Za-z]{1,4}(?:\s*[,/]\s*[A-Za-z]{1,4})*\s*(?:,|$)|\s*(?:\d|-|—|Fr|So|Jr|Sr))/i).map(strip).filter(Boolean) : null;
        if (cells && cells.length >= 2) {
          let name = '', pos = '';
          cells.forEach(c => { if (!name && !isJunk(c) && !(isPos(c) && c.length <= 5 && cells.length > 2)) name = c; else if (isPos(c) && !isGrade(c)) pos = pos ? pos + '/' + c : c; });
          if (!name) name = cells.find(c => !isJunk(c)) || '';

        }

        const words = rest.replace(/,/g, ' ').split(/\s+/).filter(Boolean);

      }

  /* ---------- field length conversion ----------
     Spots are absolute yards from the HOME goal line, so changing the field length moves every
     spot on the AWAY half by the difference; each team's own yard lines stay the same. */
  function convertFieldLength(g, newL) {

        b.append(h('div', { class: 'help' }, 'The backup holds the whole game, plays and all. Restore it on another phone or computer under App → Restore.'));
      }));
      wrap.append(section('MaxPreps', false, b => {
        b.append(h('p', { class: 'help' }, 'Roster: MaxPreps has no roster download, but the team roster page can be copied. On the MaxPreps roster page, select the table, copy, then paste it into the roster box above (Paste a whole roster). The same box takes the CSV file used to upload a roster to MaxPreps.'));
        b.append(h('p', { class: 'help' }, 'Stats: in MaxPreps Team Admin open Schedule → the game → Enter Stats, and key in each table from the Stats tab here (they use the same categories). MaxPreps file imports only accept files from its certified stat partners.'));
      }));
      wrap.append(section('Delete this game', false, b => {
        const d = h('button', { type: 'button', class: 'btn danger', onclick: () => { d.textContent = 'Tap again to delete for good'; d.onclick = () => { delete DB.games[g.id]; DB.order = DB.order.filter(x => x !== g.id); UI.gameId = null; UI.tab = 'game'; C.recompute(); C.save(); render(); toast('Game deleted'); }; } }, 'Delete game');
        b.append(d);
      }));
      wrap.append(h('button', { type: 'button', class: 'btn', onclick: () => { UI.gameId = null; UI.tab = 'game'; C.recompute(); C.save(); render(); } }, 'Close game (back to the list)'));
    } else {
      wrap.append(h('div', { class: 'brand' }, h('h1', null, 'Chain Crew'), h('span', null, 'football stats')));
      wrap.append(h('button', { type: 'button', class: 'btn primary', onclick: newGame }, 'New game'));
      wrap.append(gamesList());
    }
    wrap.append(h('h2', { style: 'margin-top:10px' }, 'App'));
    wrap.append(section('My team (saved roster for new games)', false, b => {
      if (DB.myTeam) b.append(h('div', { class: 'help' }, 'Saved: ' + DB.myTeam.name + ' (' + DB.myTeam.abbr + ') · ' + (DB.myTeam.players || []).length + ' players. New games start with this roster as the home team.'));
      else b.append(h('div', { class: 'help' }, 'Open a game, fill in your roster under its team section, then tap "Save as my team" there. New games will start with it.'));
      if (g) b.append(h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn sm', onclick: () => { DB.myTeam = E.clone(g.teams.home); C.save(); render(); toast('Saved ' + g.teams.home.name + ' as my team'); } }, 'Save ' + ab(g, 'home') + ' as my team'), h('button', { type: 'button', class: 'btn sm', onclick: () => { DB.myTeam = E.clone(g.teams.away); C.save(); render(); toast('Saved ' + g.teams.away.name + ' as my team'); } }, 'Save ' + ab(g, 'away') + ' as my team')));
    }));
    wrap.append(section('Back up or restore all games', false, b => {
      const restoreText = text => {
        try {
          let o = JSON.parse(text);
          const games = Array.isArray(o.games) ? o.games : (o.games && typeof o.games === 'object' ? Object.values(o.games) : [o]);
          let n = 0;
          games.forEach(gm => {
            if (!gm || !gm.teams || !Array.isArray(gm.events)) return;
            if (!gm.id) gm.id = E.uid();
            gm.updatedAt = gm.updatedAt || Date.now();
            DB.games[gm.id] = gm; if (!DB.order.includes(gm.id)) DB.order.unshift(gm.id); n++;
          });
          if (!n) throw new Error('no games');
          if (o.myTeam && !DB.myTeam) DB.myTeam = o.myTeam;
          if (n === 1) { UI.gameId = games[0].id; UI.tab = 'game'; }
          C.recompute(); C.save(); render(); toast(n === 1 ? 'Game restored' : n + ' games restored');
        } catch (e) { toast('That is not a Chain Crew backup'); }
      };
      b.append(h('div', { class: 'help' }, 'Everything (all games, rosters, my team) in one file. Save it before clearing the browser or moving to another phone, then bring it back here.'));
      b.append(h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn primary', onclick: () => { const all = { chaincrew: 1, savedAt: new Date().toISOString(), myTeam: DB.myTeam, games: DB.order.map(id => DB.games[id]).filter(Boolean) }; saveWithFallback('chaincrew-all-games-' + new Date().toISOString().slice(0, 10) + '.json', () => JSON.stringify(all), 'Backup of all games', () => JSON.stringify(all)); } }, 'Save backup file'),
        h('button', { type: 'button', class: 'btn', onclick: () => { const all = { chaincrew: 1, savedAt: new Date().toISOString(), myTeam: DB.myTeam, games: DB.order.map(id => DB.games[id]).filter(Boolean) }; showText('Backup of all games (paste into Notes or a message to yourself)', JSON.stringify(all)); } }, 'Copy as text')));
      const fileIn = h('input', { type: 'file', accept: '.json,application/json,text/plain', id: 'restoreFile', onchange: e => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restoreText(String(r.result)); r.readAsText(f); e.target.value = ''; } });
      b.append(h('div', { class: 'lbl', style: 'margin-top:8px' }, 'Restore'), h('label', { class: 'btn', for: 'restoreFile', style: 'display:inline-flex' }, 'Choose a backup file'), h('div', { style: 'position:absolute;left:-9999px' }, fileIn));
      const ta = h('textarea', { placeholder: 'or paste backup text here' });
      b.append(ta, h('button', { type: 'button', class: 'btn', onclick: () => restoreText(ta.value) }, 'Restore from text'));
    }));
    wrap.append(section('Appearance', false, b => {
      b.append(field('Theme', seg({ options: [{ v: 'auto', l: 'Auto' }, { v: 'dark', l: 'Dark' }, { v: 'light', l: 'Light' }], value: DB.prefs.theme || 'auto', onChange: v => { DB.prefs.theme = v; C.save(); render(); } })));
    }));
    wrap.append(section('How it works', false, b => helpText(b)));
  }
  function section(title, open, build) {
    const d = h('details', { class: 'adv', open: !!open });
    d.append(h('summary', null, title));
    const b = h('div', { class: 'stack' }); d.append(b);
    build(b);
    return d;
  }
  function helpText(b) {
    const p = t => b.append(h('p', { class: 'help' }, t));
    p('Every play you enter goes into the log. The score, down and distance, ball spot, possession and all the stats are recomputed from the log every time, so you can edit, delete or insert any play at any time and everything after it corrects itself. Undo takes back your last change.');
    p('Each play is a short series of questions, one per screen: who had the ball, where it ended, who made the tackle. Tap a player and it moves on by itself; numbers go in on the app\u2019s own keypad (tap 3, 4 for the 34), on the field picture, or with the \u22121/+1 buttons. The phone keyboard never pops up. The chips across the top show what you have entered so far; tap one to go back and change it. The result is shown before you tap Add to log.');
    p('The field picture only shows which direction each team is going; flipping it never changes a play. It flips by itself after the 1st and 3rd quarters.');
    p('Penalties: pick the foul, who it is on, accepted or declined, and whether it is marked off from where the ball is (dead-ball fouls, or fouls tacked on after a play) or from the previous spot (the last play is wiped out and its stats removed). Half the distance is applied automatically. The Result box shows the new down and distance before you save, and you can adjust it by hand when the officials do something unusual.');
    p('Sacks count as rushing attempts for the quarterback (high-school and college convention). Two tacklers on a play each get an assist, and share a sack or tackle for loss. Kneel-downs count as rushes. All of this can be changed under Rules & scoring.');
    p('Time of possession: on the first play of each drive the app asks for the game clock, and on the play that ends a possession (punt, turnover, score) it asks for the clock when the play was over. Type it like a microwave (1, 1, 4, 2 for 11:42), tap Next to accept the reading already filled in, or skip. The Clock button logs a reading any other time. Possession time is worked out from those readings and the quarter ends.');
    p('Under More, "Our team, opponent players & clock" lets you turn off the other team\u2019s player screens entirely, so their plays only ask where the ball ended and which of your players made the tackle.');
    p('If the app and the field ever disagree, tap Set situation and type in what the chain crew has. The plays already entered stay as they are.');
    p('Everything is stored on this phone only. Copy a backup after each game.');
  }

  function teamEditor(b, g, t) {
    const T = g.teams[t];
    b.append(h('div', { class: 'row' },
      field('Team name', h('input', { type: 'text', value: T.name || '', oninput: e => { T.name = e.target.value; C.save(); } })),
      field('Short', h('input', { type: 'text', value: T.abbr || '', maxlength: 5, style: 'width:90px;text-transform:uppercase', oninput: e => { T.abbr = e.target.value.toUpperCase().slice(0, 5); C.save(); C.recompute(); $('#scoreboard').replaceChildren(scoreboard(g, getR().final)); } })),
      field('Color', h('input', { type: 'color', value: T.color || '#1f4fd1', oninput: e => { T.color = e.target.value; C.save(); } }))));
    const list = h('div', { class: 'roster-list' });
    function rebuild() {
      list.replaceChildren();
      const ps = T.players || (T.players = []);
      ps.slice().sort((a, b2) => Number(a.num) - Number(b2.num)).forEach(p => list.append(h('div', { class: 'roster-item' },
        h('input', { type: 'text', inputmode: 'numeric', value: p.num, 'aria-label': 'Number', oninput: e => { p.num = e.target.value.trim(); C.save(); } }),
        h('input', { type: 'text', value: p.name || '', placeholder: 'Name', 'aria-label': 'Name', oninput: e => { p.name = e.target.value; C.save(); } }),
        h('input', { type: 'text', value: p.pos || '', placeholder: 'Pos', 'aria-label': 'Position', oninput: e => { p.pos = e.target.value; C.save(); } }),
        h('button', { type: 'button', class: 'x', 'aria-label': 'Remove', onclick: () => { T.players = T.players.filter(x => x !== p); C.save(); rebuild(); } }, '✕'))));
      if (!ps.length) list.append(h('div', { class: 'help' }, 'No players yet. Plays can still be entered by jersey number; names make the box score readable.'));
    }
    rebuild();
    b.append(h('div', { class: 'lbl' }, 'Roster'), list);
    b.append(h('button', { type: 'button', class: 'btn sm', onclick: () => { (T.players = T.players || []).push({ num: '', name: '', pos: '' }); rebuild(); const inp = list.querySelector('.roster-item:last-child input'); if (inp) inp.focus(); } }, '+ Add player'));
    const ta = h('textarea', { placeholder: '12 John Smith QB\n22 Tyler Jones\n5, Mike Brown, OL\n…or paste the MaxPreps roster page', style: 'min-height:80px' });
    b.append(h('details', { class: 'adv' }, h('summary', null, 'Paste a whole roster'), h('div', { class: 'stack' }, ta, h('button', { type: 'button', class: 'btn sm', onclick: () => {
      const parsed = E.parseRoster(ta.value);
      if (!parsed.length) { toast('No players found — one player per line, number first'); return; }
      parsed.forEach(p => { T.players = (T.players || []).filter(x => String(x.num) !== p.num); T.players.push(p); });
      ta.value = ''; C.save(); rebuild(); toast(parsed.length + ' players added');
    } }, 'Add these players'), h('div', { class: 'help' }, 'Works with "12 John Smith QB" lines, a copied MaxPreps roster page (select the roster table, copy, paste here), or the MaxPreps roster CSV.'))));
    b.append(h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn sm', onclick: () => { DB.myTeam = E.clone(T); C.save(); toast('Saved as my team'); } }, 'Save as my team'), DB.myTeam ? h('button', { type: 'button', class: 'btn sm ghost', onclick: () => { Object.assign(T, E.clone(DB.myTeam)); C.save(); C.recompute(); render(); toast('Loaded my team'); } }, 'Load my team here') : null));
  }

  function startEditor(b, g, R) {
    const S = E.settingsOf(g);
    const started = g.events.length > 0;
    b.append(field('Field length', seg({ options: [{ v: 100, l: '100 yards' }, { v: 80, l: '80 yards' }], value: S.fieldLength, onChange: v => {
      if (v === S.fieldLength) return;
      commit(gg => { E.convertFieldLength(gg, v); }, 'Field set to ' + v + ' yards' + (started ? ' — plays already entered were converted' : ''));
    } })));
    b.append(h('div', { class: 'row' },
      field('Kickoff from own', numberInput({ value: S.kickoffSpot, cls: 'yard-input', onInput: v => { g.settings.kickoffSpot = E.num(v, S.kickoffSpot); C.save(); C.recompute(); } })),
      field('Touchback at', numberInput({ value: S.touchbackSpot, cls: 'yard-input', onInput: v => { g.settings.touchbackSpot = E.num(v, S.touchbackSpot); C.save(); C.recompute(); } })),
      field('Safety kick from', numberInput({ value: S.safetyKickSpot, cls: 'yard-input', onInput: v => { g.settings.safetyKickSpot = E.num(v, S.safetyKickSpot); C.save(); C.recompute(); } }))));
    b.append(field('Who receives the opening kickoff', teamSeg(g, g.start.receivesFirst, v => { commit(gg => { gg.start.receivesFirst = v; }, started ? 'Changed — the first kickoff recomputed' : null); })));
    b.append(field('Who receives the second-half kickoff', teamSeg(g, g.start.receivesSecondHalf || E.opp(g.start.receivesFirst), v => { commit(gg => { gg.start.receivesSecondHalf = v; }); })));
    b.append(field('From where you sit, ' + ab(g, 'home') + ' defends the end zone on the…', seg({ options: [{ v: true, l: 'Left (1st quarter)' }, { v: false, l: 'Right (1st quarter)' }], value: g.start.homeDefendsLeftQ1 !== false, onChange: v => { g.start.homeDefendsLeftQ1 = v; C.save(); render(); } })));
    b.append(h('div', { class: 'help' }, 'This only sets which way the field picture faces. The teams switch ends after the 1st and 3rd quarters automatically; use Flip view on the Game tab if the picture ever faces the wrong way.'));
    b.append(fieldSVG(g, 1, { spot: E.kickSpotFor(E.opp(g.start.receivesFirst), g, 'kickoff'), team: E.opp(g.start.receivesFirst), compact: true }), fieldCaption(g, 1));
  }

  function trackingEditor(b, g) {
    const S = E.settingsOf(g);
    b.append(field('Our team', teamSeg(g, S.myTeam || 'home', v => { g.settings.myTeam = v; C.save(); C.recompute(); render(); }, { home: g.teams.home.name, away: g.teams.away.name })));
    b.append(toggle('Track the other team\u2019s players (names and numbers)', S.trackOpponents !== false, v => { g.settings.trackOpponents = v; C.save(); C.recompute(); render(); }));
    b.append(h('div', { class: 'help' }, 'Off: the app never asks who their ball carrier, passer, kicker or tackler was. Their team totals (yards, first downs, score) still count from the spots you enter.'));
    b.append(toggle('Ask for the game clock on the first play of each drive', S.askClock !== false, v => { g.settings.askClock = v; C.save(); }));
    b.append(field('Quarter length (minutes)', numberInput({ value: S.quarterMinutes || 12, cls: 'yard-input', attrs: { min: 1, max: 20 }, onInput: v => { g.settings.quarterMinutes = E.clamp(E.num(v, 12), 1, 20); C.save(); C.recompute(); } })));
    b.append(h('div', { class: 'help' }, 'The clock readings and the quarter length give time of possession on the Stats tab. The Clock button on the Game tab logs a reading any time.'));
  }
  function settingsEditor(b, g) {
    const S = E.settingsOf(g);
    const numF = (label, key) => field(label, numberInput({ value: S[key], cls: 'yard-input', onInput: v => { g.settings[key] = E.num(v, S[key]); C.save(); C.recompute(); } }));
    b.append(h('div', { class: 'row' }, numF('PAT kick', 'ptsKick'), numF('2-pt try', 'pts2pt'), numF('Field goal', 'ptsFG'), numF('Safety', 'ptsSafety')));
    b.append(h('div', { class: 'row' }, numF('Try from the', 'trySpot'), numF('Timeouts per half', 'timeoutsPerHalf'), numF('Quarters', 'quarters')));
    b.append(toggle('Sacks count as rushing attempts and yards for the QB (NCAA / high-school convention)', S.sackCountsAsRush, v => { commit(gg => { gg.settings.sackCountsAsRush = v; }); }));
    b.append(toggle('Kneel-downs count as rushing attempts', S.kneelCountsAsRush, v => { commit(gg => { gg.settings.kneelCountsAsRush = v; }); }));
    b.append(h('div', { class: 'help' }, 'Changes apply to the whole game, including plays already entered.'));
  }

  /* ---------- example game ---------- */
  function exampleGame() {
    const g = E.newGame({
      home: { name: 'Pine Grove (example)', abbr: 'PG', color: '#1e40af', players: [{ num: '2', name: 'J. Carter', pos: 'QB' }, { num: '5', name: 'M. Reyes', pos: 'RB' }, { num: '11', name: 'T. Hall', pos: 'WR' }, { num: '21', name: 'D. Brooks', pos: 'DB' }, { num: '44', name: 'C. Dixon', pos: 'LB' }, { num: '7', name: 'A. Wells', pos: 'K' }, { num: '55', name: 'B. Moss', pos: 'DL' }] },
      away: { name: 'Riverside (example)', abbr: 'RIV', color: '#991b1b', players: [{ num: '8', name: 'K. Lane', pos: 'QB' }, { num: '24', name: 'S. Pope', pos: 'RB' }, { num: '3', name: 'E. Ward', pos: 'WR' }, { num: '32', name: 'R. Cole', pos: 'LB' }, { num: '9', name: 'L. Finch', pos: 'K' }] },
      start: { receivesFirst: 'home', receivesSecondHalf: 'away', homeDefendsLeftQ1: true }
    });
    g.example = true; g.meta.site = 'Example game — delete it when you start your own';
    g.events = [
      { type: 'kickoff', team: 'away', kicker: '9', mode: 'spot', kickTo: 5, result: 'return', returner: '5', retMode: 'spot', endSpot: 25 },
      { type: 'rush', team: 'home', carrier: '5', mode: 'spot', endSpot: 30, result: 'tackled', tacklers: ['32'] },
      { type: 'pass', team: 'home', passer: '2', receiver: '11', result: 'complete', mode: 'spot', endSpot: 44, tacklers: ['32'] },
      { type: 'penalty', against: 'home', name: 'False start', yards: 5, status: 'accepted', from: 'current', downResult: 'keep' },
      { type: 'pass', team: 'home', passer: '2', receiver: '11', result: 'incomplete', pbu: ['3'] },
      { type: 'rush', team: 'home', carrier: '2', mode: 'spot', endSpot: 55, result: 'tackled', tacklers: ['32', '24'] },
      { type: 'pass', team: 'home', passer: '2', receiver: '11', result: 'complete', td: true },
      { type: 'pat', team: 'home', kind: 'kick', result: 'good', kicker: '7' },
      { type: 'kickoff', team: 'home', kicker: '7', result: 'touchback' },
      { type: 'rush', team: 'away', carrier: '24', mode: 'spot', endSpot: 72, result: 'tackled', tacklers: ['44'] },
      { type: 'pass', team: 'away', passer: '8', result: 'sack', mode: 'spot', endSpot: 78, tacklers: ['55'] },
      { type: 'pass', team: 'away', passer: '8', receiver: '3', result: 'intercepted', interceptor: '21', intSpot: 55, intEndSpot: 65 },
      { type: 'period_end' },
      { type: 'rush', team: 'home', carrier: '5', mode: 'spot', endSpot: 62, result: 'fumble', fumble: { forcedBy: '32', recTeam: 'away', recBy: '32', recSpot: 62 } },
      { type: 'pass', team: 'away', passer: '8', receiver: '3', result: 'complete', mode: 'spot', endSpot: 20, tacklers: ['21'] },
      { type: 'rush', team: 'away', carrier: '24', result: 'td' },
      { type: 'pat', team: 'away', kind: 'run', result: 'good', carrier: '24' }
    ];
    return g;
  }

  /* ---------- Android back button: step back inside the app instead of leaving it ---------- */
  function installBackGuard() {
    try {
      if (!window.history || !history.pushState) return;
      history.replaceState({ cc: 'root' }, '');
      history.pushState({ cc: 'guard' }, '');
      let lastBack = 0;
      window.addEventListener('popstate', () => {
        const now = Date.now();
        if (C.Wizard && C.Wizard.back()) { /* previous step, or cancel on the first one */ }
        else if (document.querySelector('.sheet')) C.closeSheet();
        else if (game() && UI.tab !== 'game') { UI.tab = 'game'; render(); }
        else if (now - lastBack < 2500) { history.back(); return; }
        else toast('Press back again to leave Chain Crew');
        lastBack = now;
        history.pushState({ cc: 'guard' }, '');
      });
    } catch (e) { /* no history API: nothing to guard */ }
  }

  /* ---------- boot ---------- */
  function start(hot) {
    C.load();
    if (!DB.order.length && !Object.keys(DB.games).length) { const ex = exampleGame(); DB.games[ex.id] = ex; DB.order = [ex.id]; C.save(); }
    DB.order = DB.order.filter(id => DB.games[id]); Object.keys(DB.games).forEach(id => { if (!DB.order.includes(id)) DB.order.push(id); });
    if (hot && hot.gameId && DB.games[hot.gameId]) { UI.gameId = hot.gameId; UI.tab = hot.tab || 'game'; }
    else if (DB.lastGame && DB.games[DB.lastGame]) UI.gameId = DB.lastGame;
    if (!UI.gameId && DB.order.length === 1) UI.gameId = DB.order[0];
    C.recompute();
    render();
    if (!C.inViewer) installBackGuard();
    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ gameId: UI.gameId, tab: UI.tab })); } catch (e) { /* ignore */ }
  }
  const _save = C.save;
  C.save = function () { DB.lastGame = UI.gameId; _save(); };
  try {
    if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
    else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  } catch (e) { start({}); }
})();

</script>

})();
