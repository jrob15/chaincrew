:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
/* Layout: a one-screen press-box console — scoreboard on top, field strip and down & distance,
   a grid of big play buttons, the last play with Undo, and tabs along the bottom. Dark-first for night games. */
:root {
  --bg: #0e1316;
  --surface: #161d22;
  --surface-2: #202a31;
  --fg: #eef2ee;
  --muted: #94a19b;
  --line: #2c3840;
  --accent: #f2c744;
  --accent-fg: #17130a;
  --good: #4fc98c;
  --bad: #ef5a5a;
  --info: #62acff;
  --turf: #1d5c33;
  --turf-dark: #184d2b;
  --chalk: rgba(255,255,255,.62);
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --font-display: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', 'Segoe UI', Roboto, system-ui, sans-serif;
  --radius: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1ec; --surface: #ffffff; --surface-2: #e4e9e3; --fg: #141b1f; --muted: #5a6964; --line: #cfd7d1;
    --accent: #b88a00; --accent-fg: #ffffff; --good: #1f8f55; --bad: #c62828; --info: #1e6fd9;
    --turf: #2f8d4f; --turf-dark: #297a45; --chalk: rgba(255,255,255,.8); --shadow: 0 10px 30px rgba(20,30,25,.18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1ec; --surface: #ffffff; --surface-2: #e4e9e3; --fg: #141b1f; --muted: #5a6964; --line: #cfd7d1;
  --accent: #b88a00; --accent-fg: #ffffff; --good: #1f8f55; --bad: #c62828; --info: #1e6fd9;
  --turf: #2f8d4f; --turf-dark: #297a45; --chalk: rgba(255,255,255,.8); --shadow: 0 10px 30px rgba(20,30,25,.18);
  color-scheme: light;
}

html { box-sizing: border-box; height: 100%; }

<script>
/* Chain Crew engine — pure game logic.
   The game is an ordered list of events the stat keeper typed. Every piece of
   derived state (score, down, distance, ball spot, possession, quarter, stats)

   inserting any event is always safe.

    { name: 'Pass interference (defense)', side: 'def', yards: 15, from: 'previous', down: 'keep' },
    { name: 'Intentional grounding', side: 'off', yards: 5, from: 'previous', down: 'loss' },
    { name: 'Illegal forward pass', side: 'off', yards: 5, from: 'previous', down: 'loss' },

    { name: 'Roughing the kicker', side: 'def', yards: 15, from: 'previous', down: 'auto' },
    { name: 'Running into the kicker', side: 'def', yards: 5, from: 'previous', down: 'keep' },
    { name: 'Personal foul', side: 'any', yards: 15, from: 'current', down: 'keep' },
    { name: 'Unsportsmanlike conduct', side: 'any', yards: 15, from: 'current', down: 'keep' },
    { name: 'Facemask', side: 'any', yards: 15, from: 'current', down: 'keep' },
    { name: 'Horse-collar tackle', side: 'def', yards: 15, from: 'current', down: 'keep' },

  }

  /* ---------- boot ---------- */
  function start(hot) {
    C.load();
    if (!DB.order.length && !Object.keys(DB.games).length) { const ex = exampleGame(); DB.games[ex.id] = ex; DB.order = [ex.id]; C.save(); }
    DB.order = DB.order.filter(id => DB.games[id]); Object.keys(DB.games).forEach(id => { if (!DB.order.includes(id)) DB.order.push(id); });
    if (hot && hot.gameId && DB.games[hot.gameId]) { UI.gameId = hot.gameId; UI.tab = hot.tab || 'game'; }
    else if (DB.lastGame && DB.games[DB.lastGame]) UI.gameId = DB.lastGame;
    if (!UI.gameId && DB.order.length === 1) UI.gameId = DB.order[0];
    C.recompute();
    render();
    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ gameId: UI.gameId, tab: UI.tab })); } catch (e) { /* ignore */ }
  }
  const _save = C.save;
  C.save = function () { DB.lastGame = UI.gameId; _save(); };
  try {
    if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
    else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  } catch (e) { start({}); }
})();
